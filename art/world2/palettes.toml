# World 2 per-mission palettes (12-bit 0xRGB; the copper loads them, the band text art carries mission 4's for previews).
# Pens 1-7 dark to light. Sky: a line-dithered copper gradient 'top' to 'low' (low = the haze H) on lines 24-179,
# then H to C on lines 180-207 (the sea's depth), flat C on 208-255. AGA: the same gradients in 24 bits (aga_*).

[m4_reef_run]
name = "Reef Run"
mood = "morning"
sky_top = "0x28B"
sky_low_haze_H = "0xCFE"
