# ROTOR RESCUE art on the floppy: art.toml's format, converted by art/tools/make_disk_art.py
# (with agk's converter) into disk/diskart.bin and src/disk_art.h. Run it after editing any
# of these sources; `python3 art/tools/make_disk_art.py --check` says whether they are stale.
# main.c loads the file during the splash (diskArtLoad) into one chip block, which holds the
# chopper's frames and the bands' and BOBs' bitmaps.
[art]
depth = 3                 # (as art.toml: the palette's depth)

[chopper]                 # 32x20, 15 colours: two attached pairs (channels 0-3)
source = "chopper.txt"    # (on the floppy: the frames' sprite rows, no control words)
kind = "sprite"
attached = true
channel = 0
mirror = true

# the BOBs (PF1, blitted): image and mask each, as agk's artNAMECreate() would make them
[hangar]
source = "hangar.txt"
kind = "bob"

[fence]
source = "fence.txt"
kind = "bob"

[barracks]
source = "barracks.txt"
kind = "bob"

[tank]
source = "tank.txt"
kind = "bob"

[hostage]
source = "hostage.txt"
kind = "bob"

[jet]
source = "jet.txt"
kind = "bob"

[mine]
source = "mine.txt"
kind = "bob"

[shot]
source = "shot.txt"
kind = "bob"

[bomb]
source = "bomb.txt"
kind = "bob"

[shell]
source = "shell.txt"
kind = "bob"

[boom]
source = "boom.txt"
kind = "bob"

[shadow]                  # the chopper's shadow on the track (dithered colour 1)
source = "shadow.txt"
kind = "bob"

[flag]
source = "flag.txt"
kind = "bob"

[smoke]                   # 16x8, 3 frames: the damaged chopper's trail
source = "smoke.txt"
kind = "bob"

[clouds]                  # PF2 band, camera / 8 (the far sky)
source = "clouds.txt"
kind = "bitmap"
depth = 3
palette = "cloud_pal.txt"
wrap_x = 320

# (the plain's floor is not here: art/tools/make_plain.py writes it to disk/plainfloor.bin)
[mountains]               # PF2 band, camera / 4: mountains.txt rows 0-49 + the plain's far strip
source = "mountains_play.txt"   # (art/tools/make_plain.py writes it; docs/plain-spec.md)
kind = "bitmap"
depth = 3
palette = "mtn_pal.txt"
wrap_x = 320

[title_mtn]               # the title's PF2 mountain strip (lines 162-195), camera / 4
source = "title_mtn.txt"
kind = "bitmap"
depth = 3
palette = "mtn_pal.txt"
wrap_x = 320

[hills]                   # PF2 band, camera / 2
source = "hills.txt"
kind = "bitmap"
depth = 3
palette = "land_pal.txt"
wrap_x = 320

[ground]                  # PF2 band, camera / 1
source = "ground.txt"
kind = "bitmap"
depth = 3
palette = "land_pal.txt"
wrap_x = 320
