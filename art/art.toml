# ROTOR RESCUE art, converted by agk (agk art / agk build). Reference: agk help-art
# Everything is drawn by art/tools/draw.py (python3 art/tools/draw.py).
[art]
depth = 3                 # playfield 1: BOBs, 7 colours

[chopper]                 # 32x20, 15 colours: two attached pairs (channels 0-3)
source = "chopper.txt"
kind = "sprite"
attached = true
channel = 0
mirror = true

